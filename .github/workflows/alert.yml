name: NNFT Alert Bot

on:
  schedule:
    # runs every 30 minutes -- new launches move fast
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          PUMP_LISTEN_SECONDS: "25"
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "new-launch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_launches.json || true
          git diff --staged --quiet || git commit -m "update bot state [skip ci]"
          git pull --rebase origin main || true
          git push
